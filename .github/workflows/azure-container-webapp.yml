name: Build and deploy a .NET app to Azure Web App

env:
  AZURE_WEBAPP_NAME: ja-lang-api  # set this to the name of your Azure Web App

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  # specify .NET version here

      - name: Restore dependencies
        run: dotnet restore Source/Japanese.WebAPI.sln

      - name: Build
        run: dotnet build Source/Japanese.WebAPI.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Source/Japanese.WebAPI.sln --configuration Release --output Publish --no-build
      
      - name: Create appsettings.Development.json
        run: |
            echo "{
              \"ConnectionStrings\": {
                \"RedisConnection\": \"${{ secrets.REDIS_CONNECTION }}\"
              },
              \"CORS\": {
                \"Origin\": \"${{ secrets.CORS_ORIGIN }}\"
              },
              \"MongoDB\": {
                \"ConnectionString\": \"${{ secrets.MONGODB_CONNECTION }}\",
                \"DatabaseName\": \"${{ secrets.MONGODB_DATABASE_NAME }}\"
              },
              \"DistributedCacheSettings\": {
                \"AbsoluteExpiration\": \"${{ secrets.CACHE_EXPIRATION }}\"
              },
              \"Logging\": {
                \"LogLevel\": {
                  \"Default\": \"Information\",
                  \"Microsoft.AspNetCore\": \"Warning\"
                }
              },
              \"AllowedHosts\": \"*\"
            }" > Publish/appsettings.Development.json
        
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: Publish
